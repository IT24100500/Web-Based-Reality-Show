<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Feedback Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        .table {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
        }

        .table thead {
            background: linear-gradient(to right, #6a11cb, #2575fc);
        }

        .star {
            color: gold;
            font-size: 1.1rem;
        }
        .star-empty {
            color: #555;
            font-size: 1.1rem;
        }

        .btn-warning {
            background: linear-gradient(to right, #f7971e, #ffd200);
            border: none;
            border-radius: 30px;
            font-weight: 600;
        }

        .btn-danger {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            border: none;
            border-radius: 30px;
            font-weight: 600;
        }

        .alert-info {
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            color: white;
            border: none;
        }

        /* Dark modal styling */
        .modal-content {
            background: rgba(30, 30, 45, 0.95);
            color: #fff;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 2px #6a11cb;
            color: white;
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <h2 class="mb-4 text-center" style="background: linear-gradient(to right, #ff4d94, #6a11cb); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        <i class="fa-solid fa-comments me-2"></i> Feedback Management
    </h2>

    <!-- ⭐ Overall average rating -->
    <div class="alert alert-info mb-4" th:if="${averageRating > 0}">
        <strong>Average Rating (All Users):</strong>
        <span th:text="${#numbers.formatDecimal(averageRating,1,1)}"></span> / 5
        <span>
            <span th:each="i : ${#numbers.sequence(1,5)}"
                  th:classappend="${i <= averageRating} ? 'star' : 'star-empty'">★</span>
        </span>
    </div>

    <!-- Feedback Table -->
    <div class="table-responsive">
        <table class="table table-hover shadow-lg align-middle">
            <thead>
            <tr>
                <th>User</th>
                <th>Message</th>
                <th>Rating</th>
                <th>Submitted At</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${feedbackList}">
                <td th:text="${f.user.username + ' (' + f.user.email + ')'}"></td>
                <td th:text="${f.message}"></td>
                <td>
                    <span th:if="${f.rating != null}">
                        <span th:each="i : ${#numbers.sequence(1,5)}"
                              th:classappend="${i <= f.rating} ? 'star' : 'star-empty'">★</span>
                    </span>
                    <span th:if="${f.rating == null}">N/A</span>
                </td>
                <td th:text="${#temporals.format(f.submittedAt,'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <!-- Edit Button -->
                    <button type="button" class="btn btn-warning btn-sm"
                            data-bs-toggle="modal" data-bs-target="#editFeedbackModal"
                            th:attr="data-id=${f.feedbackId},
                                     data-user=${f.user.username},
                                     data-message=${f.message},
                                     data-rating=${f.rating}">
                        <i class="fa-solid fa-pen-to-square"></i> Edit
                    </button>

                    <!-- Delete Button -->
                    <form th:action="@{/admin/feedback/delete/{id}(id=${f.feedbackId})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm"><i class="fa-solid fa-trash"></i> Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${feedbackList == null or feedbackList.isEmpty()}">
                <td colspan="5" class="text-center text-muted">No feedback available.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ===================== DARK EDIT FEEDBACK MODAL ===================== -->
<div class="modal fade" id="editFeedbackModal" tabindex="-1" aria-labelledby="editFeedbackModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" style="background: linear-gradient(to right, #6a11cb, #2575fc); border-bottom: none;">
                <h5 class="modal-title" id="editFeedbackModalLabel"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Feedback</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <form th:action="@{/admin/feedback/update}" method="post">
                <div class="modal-body">
                    <input type="hidden" id="feedbackId" name="feedbackId">

                    <div class="mb-3">
                        <label class="form-label">User</label>
                        <input type="text" class="form-control" id="editUser" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" id="editMessage" name="message" rows="4" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rating (1–5)</label>
                        <input type="number" class="form-control" id="editRating" name="rating" min="1" max="5">
                    </div>
                </div>

                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                            style="background: rgba(255,255,255,0.1); border-radius: 30px;">Cancel</button>
                    <button type="submit" class="btn btn-success"
                            style="background: linear-gradient(to right, #6a11cb, #2575fc); border-radius: 30px;">
                        <i class="fa-solid fa-save me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ===================== JS ===================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const editModal = document.getElementById("editFeedbackModal");
        editModal.addEventListener("show.bs.modal", function (event) {
            const button = event.relatedTarget;

            // Extract data attributes
            const id = button.getAttribute("data-id");
            const user = button.getAttribute("data-user");
            const message = button.getAttribute("data-message");
            const rating = button.getAttribute("data-rating");

            // Populate modal
            document.getElementById("feedbackId").value = id;
            document.getElementById("editUser").value = user;
            document.getElementById("editMessage").value = message || "";
            document.getElementById("editRating").value = rating || "";
        });
    });
</script>
</body>
</html>
